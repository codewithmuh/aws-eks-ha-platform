# The "BEFORE": the whole platform on a single host, the way the Upwork client's
# stack starts out. Everything here is one `docker compose up` away — this is what
# we later migrate to Kubernetes on AWS EKS (RDS / ElastiCache / MSK).
#
# Note the two approval-worker replicas (a + b): only one becomes leader, and the
# fencing token keeps the other (or a zombie) from ever double-writing.
name: aws-eks-ha-platform

x-app-env: &app-env
  JWT_SECRET: ${JWT_SECRET:-dev-insecure-change-me}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
      POSTGRES_DB: platform
    ports: ["5432:5432"]   # exposed for local convenience; Phase-1 hardening closes this
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8.0
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --mode=dev-container
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  login-service:
    build: ./app/login-service
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://platform:${POSTGRES_PASSWORD:-platform}@postgres:5432/platform
    ports: ["8081:8000"]
    depends_on:
      postgres: {condition: service_healthy}

  authorize-service:
    build: ./app/authorize-service
    environment:
      <<: *app-env
      VALKEY_URL: redis://valkey:6379/0
    ports: ["8082:8000"]
    depends_on:
      valkey: {condition: service_healthy}

  approval-worker-a:
    build: ./app/approval-worker
    environment:
      <<: *app-env
      POD_NAME: worker-a
      DATABASE_URL: postgresql://platform:${POSTGRES_PASSWORD:-platform}@postgres:5432/platform
      REDPANDA_BOOTSTRAP: redpanda:9092
    ports: ["8083:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}

  approval-worker-b:
    build: ./app/approval-worker
    environment:
      <<: *app-env
      POD_NAME: worker-b
      DATABASE_URL: postgresql://platform:${POSTGRES_PASSWORD:-platform}@postgres:5432/platform
      REDPANDA_BOOTSTRAP: redpanda:9092
    ports: ["8084:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}

volumes:
  pgdata:
