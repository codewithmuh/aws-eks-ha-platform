# In-cluster DEV stores for the kind demo only. These stand in for the managed
# AWS services (RDS / ElastiCache / MSK), which is why they are single-replica and
# ephemeral — on AWS the data layer is Terraform-managed, never in the cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: platform
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          env:
            - {name: POSTGRES_USER, value: platform}
            - {name: POSTGRES_PASSWORD, value: platform}
            - {name: POSTGRES_DB, value: platform}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "platform", "-d", "platform"]}
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: platform}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: platform
spec:
  replicas: 1
  selector: {matchLabels: {app: valkey}}
  template:
    metadata: {labels: {app: valkey}}
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8.0
          args: ["--save", "", "--appendonly", "no"]
          ports: [{containerPort: 6379}]
          readinessProbe:
            exec: {command: ["valkey-cli", "ping"]}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: valkey, namespace: platform}
spec:
  selector: {app: valkey}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: platform
spec:
  replicas: 1
  selector: {matchLabels: {app: redpanda}}
  template:
    metadata: {labels: {app: redpanda}}
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.2.7
          args:
            - redpanda
            - start
            - --smp=1
            - --overprovisioned
            - --node-id=0
            - --mode=dev-container
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr=PLAINTEXT://redpanda.platform.svc.cluster.local:9092
          ports: [{containerPort: 9092}]
          readinessProbe:
            exec: {command: ["sh", "-c", "rpk cluster health | grep -q 'Healthy:.*true'"]}
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: redpanda, namespace: platform}
spec:
  selector: {app: redpanda}
  ports: [{port: 9092, targetPort: 9092}]
